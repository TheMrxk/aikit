[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aikit"
version = "0.1.0"
description = "通用 AI 接入层：统一封装多家大模型 / coding plan / 中转站，OpenAI 兼容协议，支持多源配置、故障转移、JSON 模式、流式。"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TheMrxk" }]
keywords = ["ai", "llm", "openai", "deepseek", "mimo", "coding-plan", "chat"]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# 测试台 Web 界面所需；核心库本身只需 httpx
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7", "fastapi>=0.110", "uvicorn>=0.27"]

[tool.setuptools.packages.find]
include = ["aikit*"]
exclude = ["examples*", "tests*", "web*"]
